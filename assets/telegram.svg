<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="210" viewBox="0 0 1280 210" role="img" aria-label="Наш Telegram-канал MakeyStar" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08131F"/><stop offset=".55" stop-color="#0E1530"/><stop offset="1" stop-color="#1A1236"/></linearGradient>
<linearGradient id="btn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3FD0FF"/><stop offset="1" stop-color="#2A7DFF"/></linearGradient>
<linearGradient id="tt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#9FE7FF"/></linearGradient>
<radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3FD0FF" stop-opacity=".45"/><stop offset="1" stop-color="#3FD0FF" stop-opacity="0"/></radialGradient>
<radialGradient id="gl2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8B6CFF" stop-opacity=".35"/><stop offset="1" stop-color="#8B6CFF" stop-opacity="0"/></radialGradient>
<clipPath id="c"><rect width="1280" height="210" rx="22"/></clipPath>
<style>
.fly{animation:fly 5s ease-in-out infinite}
.trail{stroke-dasharray:8 14;animation:trail 1s linear infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ring{animation:ring 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.drift{animation:drift 12s ease-in-out infinite alternate}
.msg1{animation:msg 6s ease-in-out infinite} .msg2{animation:msg 6s ease-in-out infinite 2s} .msg3{animation:msg 6s ease-in-out infinite 4s}
.shine{animation:shine 3.5s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(10px,-10px) rotate(-4deg)}}
@keyframes trail{to{stroke-dashoffset:-22}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.18)}}
@keyframes drift{from{transform:translateX(-50px)}to{transform:translateX(50px)}}
@keyframes msg{0%,100%{opacity:.25;transform:translateY(4px)}20%,60%{opacity:1;transform:translateY(0)}}
@keyframes shine{0%{transform:translateX(-200px)}60%,100%{transform:translateX(420px)}}
</style>
<clipPath id="bc"><rect x="930" y="74" width="300" height="64" rx="32"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="1280" height="210" fill="url(#bg)"/>
<g class="drift"><circle cx="980" cy="40" r="260" fill="url(#gl2)"/></g>
<circle cx="120" cy="105" r="120" fill="url(#gl)"/>
<path class="trail" d="M30 150 Q70 140 92 122" stroke="#3FD0FF" stroke-opacity=".6" stroke-width="3" fill="none" stroke-linecap="round"/>
<g class="fly"><g transform="translate(120 100) scale(2.2)">
<path d="M-21 -1 L20 -18 L12 19 L1 8 L-9 15 L-6 4 Z" fill="url(#btn)" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M-6 4 L20 -18" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/></g></g>
<g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
<text x="240" y="78" font-size="15" font-weight="700" letter-spacing="3" fill="#3FD0FF">TELEGRAM-КАНАЛ</text>
<text x="238" y="120" font-size="40" font-weight="700" fill="url(#tt)">Новости MakeyStar</text>
<text x="240" y="154" font-size="18" fill="#9FB3CC">Обновления, советы и полезная информация о приложении</text>
<g font-size="14" fill="#CFEFFF">
<g class="msg1"><rect x="240" y="170" width="150" height="26" rx="13" fill="#3FD0FF" fill-opacity=".14"/><text x="258" y="188">Вышла 3.0.0</text></g>
<g class="msg2"><rect x="400" y="170" width="190" height="26" rx="13" fill="#8B6CFF" fill-opacity=".18"/><text x="418" y="188">Как настроить игру</text></g>
<g class="msg3"><rect x="600" y="170" width="200" height="26" rx="13" fill="#5BE39A" fill-opacity=".14"/><text x="618" y="188">Ответы на вопросы</text></g>
</g>
<rect class="ring" x="930" y="74" width="300" height="64" rx="32" fill="none" stroke="#3FD0FF" stroke-width="2"/>
<g class="pulse"><rect x="930" y="74" width="300" height="64" rx="32" fill="url(#btn)"/>
<g clip-path="url(#bc)"><rect class="shine" x="900" y="60" width="60" height="100" fill="#FFFFFF" fill-opacity=".25" transform="skewX(-20)"/></g>
<text x="1080" y="114" text-anchor="middle" font-size="21" font-weight="700" fill="#06111C">Подписаться</text></g>
</g>
</g>
<rect x=".5" y=".5" width="1279" height="209" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>
