<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A2416"/><stop offset="1" stop-color="#14171C"/></linearGradient>
<radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D9A85A" stop-opacity=".55"/><stop offset="1" stop-color="#D9A85A" stop-opacity="0"/></radialGradient>
<linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5DDA8"/><stop offset="1" stop-color="#D9A85A"/></linearGradient>
<style>.ring{animation:ring 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ring{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(1.22)}}
.ib-spin{animation:ibspin 9s linear infinite;transform-box:fill-box;transform-origin:center}
.ib-spin-slow{animation:ibspin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.ib-pulse{animation:ibpulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ib-spark{animation:ibtw 1.8s ease-in-out infinite}
.ib-tw1{animation:ibtw 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ib-tw2{animation:ibtw 2.6s ease-in-out infinite .8s;transform-box:fill-box;transform-origin:center}
.ib-tw3{animation:ibtw 2.6s ease-in-out infinite 1.6s;transform-box:fill-box;transform-origin:center}
.ib-needle{animation:ibneedle 4s ease-in-out infinite;transform-origin:0 0}
.ib-draw{stroke-dasharray:40;animation:ibdraw 3s ease-in-out infinite}
.ib-k1{animation:ibk 3.2s ease-in-out infinite}
.ib-k2{animation:ibk 3.2s ease-in-out infinite -1.1s}
.ib-k3{animation:ibk 3.2s ease-in-out infinite -2.2s}
.ib-rock{animation:ibrock 3s ease-in-out infinite;transform-origin:0 0}
.ib-blink{animation:ibblink 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ib-slash{stroke-dasharray:60;animation:ibdraw 4s ease-in-out infinite}
.ib-float{animation:ibfloat 3.4s ease-in-out infinite}
.ib-orbit{animation:iborbit 3s linear infinite}
.ib-bob{animation:ibfloat 2.8s ease-in-out infinite}
.ib-fly{animation:ibfly 3s ease-in-out infinite}
.ib-trail{animation:ibtw 1.5s ease-in-out infinite}
.ib-shackle{animation:ibshackle 3s ease-in-out infinite}
.ib-trace{stroke-dasharray:36;animation:ibdraw 2.6s linear infinite}
.ib-globe{animation:ibglobe 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ibspin{to{transform:rotate(360deg)}}
@keyframes ibpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes ibtw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes ibneedle{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(35deg)}}
@keyframes ibdraw{0%{stroke-dashoffset:40}35%,100%{stroke-dashoffset:0}}
@keyframes ibk{0%,100%{transform:translateX(-12px)}50%{transform:translateX(12px)}}
@keyframes ibrock{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes ibblink{0%,44%,52%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
@keyframes ibfloat{0%,100%{transform:translateY(2px)}50%{transform:translateY(-3px)}}
@keyframes iborbit{to{stroke-dashoffset:-132}}
@keyframes ibfly{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-4px)}}
@keyframes ibshackle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes ibglobe{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.25)}}
</style>
</defs>
<circle cx="48" cy="48" r="46" fill="url(#gl)"/>
<rect class="ring" x="10" y="10" width="76" height="76" rx="22" fill="none" stroke="#F5DDA8" stroke-width="2"/>
<rect x="10" y="10" width="76" height="76" rx="22" fill="url(#tile)" stroke="#D9A85A" stroke-opacity=".75" stroke-width="1.5"/>
<g transform="translate(48 48) scale(1.1)"><path d="M-7 -20 V-14 M-7 14 V20 M-20 -7 H-14 M14 -7 H20" stroke="#EDEFF3" stroke-width="2.6" stroke-linecap="round"/><path d="M0 -20 V-14 M0 14 V20 M-20 0 H-14 M14 0 H20" stroke="#EDEFF3" stroke-width="2.6" stroke-linecap="round"/><path d="M7 -20 V-14 M7 14 V20 M-20 7 H-14 M14 7 H20" stroke="#EDEFF3" stroke-width="2.6" stroke-linecap="round"/><rect x="-14" y="-14" width="28" height="28" rx="6" fill="url(#ig)" fill-opacity="0.35" stroke="#EDEFF3" stroke-width="3"/>
<path class="ib-trace" d="M-7 4 L-2 -4 L3 3 L7 -5" fill="none" stroke="#EDEFF3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
