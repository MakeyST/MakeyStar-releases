<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="170" viewBox="0 0 1280 170" role="img" aria-label="MakeyStar — бесплатно. Настоящий только здесь." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0B0916"/><stop offset=".5" stop-color="#181133"/><stop offset="1" stop-color="#0B0916"/></linearGradient>
<linearGradient id="star" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9DFFF"/><stop offset=".5" stop-color="#B49CFF"/><stop offset="1" stop-color="#7C5CFF"/></linearGradient>
<linearGradient id="tt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B49CFF"/></linearGradient>
<radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8B6CFF" stop-opacity=".5"/><stop offset="1" stop-color="#8B6CFF" stop-opacity="0"/></radialGradient>
<clipPath id="c"><rect width="1280" height="170" rx="22"/></clipPath>
<style>
.float{animation:float 5s ease-in-out infinite}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tw1{animation:tw 2.6s ease-in-out infinite} .tw2{animation:tw 3.3s ease-in-out infinite .9s} .tw3{animation:tw 4s ease-in-out infinite 1.7s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
</style>
</defs>
<g clip-path="url(#c)">
<rect width="1280" height="170" fill="url(#bg)"/>
<circle class="pulse" cx="640" cy="60" r="120" fill="url(#gl)"/>
<circle class="tw1" cx="300" cy="40" r="2" fill="#fff"/><circle class="tw2" cx="980" cy="120" r="2.2" fill="#fff"/>
<circle class="tw3" cx="1120" cy="40" r="1.6" fill="#fff"/><circle class="tw2" cx="160" cy="130" r="1.8" fill="#fff"/>
<g class="float"><path transform="translate(640 58) scale(.55) translate(-250 -180)" d="M250 92 L276 152 L341 158 L292 201 L307 265 L250 231 L193 265 L208 201 L159 158 L224 152 Z" fill="url(#star)" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linejoin="round"/></g>
<g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" text-anchor="middle">
<text x="640" y="128" font-size="26" font-weight="700" fill="url(#tt)">MakeyStar — бесплатно. Настоящий только здесь.</text>
<text x="640" y="155" font-size="15" fill="#9B93B8">Автор: Makeenkov Igor · работает благодаря zapret (bol-van) и стратегиям Flowseal</text>
</g>
</g>
<rect x=".5" y=".5" width="1279" height="169" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>
