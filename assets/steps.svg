<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-label="Быстрый старт: скачайте, положите в папку, запустите — готово" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1014"/><stop offset="1" stop-color="#14171C"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E2229"/><stop offset="1" stop-color="#15181D"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0CF8E"/><stop offset="1" stop-color="#DDB066"/></linearGradient>
<clipPath id="c"><rect width="1280" height="250" rx="22"/></clipPath>
<style>
.hl{opacity:0;animation:hl 2.4s ease-in-out infinite}
.num{animation:num 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:6 30;animation:flow .8s linear infinite}
@keyframes hl{0%,100%{opacity:0}25%,45%{opacity:1}}
@keyframes num{0%,100%{transform:scale(1)}30%{transform:scale(1.12)}}
@keyframes flow{to{stroke-dashoffset:-36}}
</style>
</defs>
<g clip-path="url(#c)"><rect width="1280" height="250" fill="url(#bg)"/>
<g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"><g>
<rect x="30" y="30" width="290" height="190" rx="20" fill="url(#card)" stroke="#2B2618"/>
<rect class="hl" x="30" y="30" width="290" height="190" rx="20" fill="none" stroke="url(#acc)" stroke-width="2" style="animation-delay:0.0s"/>
<circle cx="80" cy="80" r="26" fill="url(#acc)" class="num" style="animation-delay:0.0s"/>
<text x="80" y="89" text-anchor="middle" font-size="24" font-weight="700" fill="#090A0D">1</text>
<text x="54" y="148" font-size="24" font-weight="700" fill="#EDEFF3">Скачайте</text>
<text x="54" y="178" font-size="16" fill="#A3AAB8">MakeyStar.exe</text>
<text x="54" y="200" font-size="16" fill="#A3AAB8">с этой страницы</text>
</g><path d="M322 125 h16" stroke="#3A3220" stroke-width="2"/><path class="flow" d="M322 125 h16" stroke="#F5DDA8" stroke-width="3" stroke-linecap="round" style="animation-delay:0.0s"/><g>
<rect x="340" y="30" width="290" height="190" rx="20" fill="url(#card)" stroke="#2B2618"/>
<rect class="hl" x="340" y="30" width="290" height="190" rx="20" fill="none" stroke="url(#acc)" stroke-width="2" style="animation-delay:0.6s"/>
<circle cx="390" cy="80" r="26" fill="url(#acc)" class="num" style="animation-delay:0.6s"/>
<text x="390" y="89" text-anchor="middle" font-size="24" font-weight="700" fill="#090A0D">2</text>
<text x="364" y="148" font-size="24" font-weight="700" fill="#EDEFF3">Положите</text>
<text x="364" y="178" font-size="16" fill="#A3AAB8">в постоянную папку,</text>
<text x="364" y="200" font-size="16" fill="#A3AAB8">например C:\MakeyStar</text>
</g><path d="M632 125 h16" stroke="#3A3220" stroke-width="2"/><path class="flow" d="M632 125 h16" stroke="#F5DDA8" stroke-width="3" stroke-linecap="round" style="animation-delay:0.6s"/><g>
<rect x="650" y="30" width="290" height="190" rx="20" fill="url(#card)" stroke="#2B2618"/>
<rect class="hl" x="650" y="30" width="290" height="190" rx="20" fill="none" stroke="url(#acc)" stroke-width="2" style="animation-delay:1.2s"/>
<circle cx="700" cy="80" r="26" fill="url(#acc)" class="num" style="animation-delay:1.2s"/>
<text x="700" y="89" text-anchor="middle" font-size="24" font-weight="700" fill="#090A0D">3</text>
<text x="674" y="148" font-size="24" font-weight="700" fill="#EDEFF3">Запустите</text>
<text x="674" y="178" font-size="16" fill="#A3AAB8">и один раз</text>
<text x="674" y="200" font-size="16" fill="#A3AAB8">подтвердите запрос Windows</text>
</g><path d="M942 125 h16" stroke="#3A3220" stroke-width="2"/><path class="flow" d="M942 125 h16" stroke="#F5DDA8" stroke-width="3" stroke-linecap="round" style="animation-delay:1.2s"/><g>
<rect x="960" y="30" width="290" height="190" rx="20" fill="url(#card)" stroke="#2B2618"/>
<rect class="hl" x="960" y="30" width="290" height="190" rx="20" fill="none" stroke="url(#acc)" stroke-width="2" style="animation-delay:1.7999999999999998s"/>
<circle cx="1010" cy="80" r="26" fill="url(#acc)" class="num" style="animation-delay:1.7999999999999998s"/>
<text x="1010" y="89" text-anchor="middle" font-size="24" font-weight="700" fill="#090A0D">4</text>
<text x="984" y="148" font-size="24" font-weight="700" fill="#EDEFF3">Готово</text>
<text x="984" y="178" font-size="16" fill="#A3AAB8">движок, стратегии и обход</text>
<text x="984" y="200" font-size="16" fill="#A3AAB8">настроятся сами</text>
</g></g></g>
<rect x=".5" y=".5" width="1279" height="249" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>
