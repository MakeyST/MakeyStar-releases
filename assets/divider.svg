<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="14" viewBox="0 0 1280 14" role="presentation">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B6CFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8B6CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B6CFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3FD0FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E6DDFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#3FD0FF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sweep { animation: sweep 5s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-260px) } 100% { transform: translateX(1280px) } }
    </style>
  </defs>
  <rect x="0" y="6" width="1280" height="2" fill="url(#g)"/>
  <g class="sweep"><rect x="0" y="5.5" width="240" height="3" rx="1.5" fill="url(#h)"/></g>
</svg>
