<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="132" viewBox="0 0 1280 132" role="img" aria-label="Что MakeyStar меняет в системе" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0916"/><stop offset=".6" stop-color="#130E25"/><stop offset="1" stop-color="#1A1234"/></linearGradient>
<linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A2150"/><stop offset="1" stop-color="#17112E"/></linearGradient>
<linearGradient id="tt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#E2D9FF"/><stop offset="1" stop-color="#FFD27A"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E8A33D" stop-opacity=".9"/><stop offset=".6" stop-color="#E8A33D" stop-opacity=".25"/><stop offset="1" stop-color="#E8A33D" stop-opacity="0"/></linearGradient>
<radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#E8A33D" stop-opacity=".45"/><stop offset="1" stop-color="#E8A33D" stop-opacity="0"/></radialGradient>
<radialGradient id="gl2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD27A" stop-opacity=".18"/><stop offset="1" stop-color="#FFD27A" stop-opacity="0"/></radialGradient>
<linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD27A"/><stop offset="1" stop-color="#E8A33D"/></linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity=".05"/></pattern>
<clipPath id="c"><rect width="1280" height="132" rx="20"/></clipPath>
<style>
.in{animation:in 1s cubic-bezier(.2,.8,.2,1) both} .in2{animation:in 1s cubic-bezier(.2,.8,.2,1) .15s both} .in3{animation:in 1s cubic-bezier(.2,.8,.2,1) .3s both}
.ring{animation:ring 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.drift{animation:drift 12s ease-in-out infinite alternate}
.dots{animation:dots 20s linear infinite}
.pk{stroke-dasharray:70 1200;animation:pk 4.5s cubic-bezier(.5,0,.5,1) infinite}
@keyframes in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(40px)}}
@keyframes dots{from{transform:translate(0,0)}to{transform:translate(26px,26px)}}
@keyframes pk{from{stroke-dashoffset:70}to{stroke-dashoffset:-1200}}

.ib-spin{animation:ibspin 9s linear infinite;transform-box:fill-box;transform-origin:center}
.ib-spin-slow{animation:ibspin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.ib-pulse{animation:ibpulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ib-spark{animation:ibtw 1.8s ease-in-out infinite}
.ib-tw1{animation:ibtw 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ib-tw2{animation:ibtw 2.6s ease-in-out infinite .8s;transform-box:fill-box;transform-origin:center}
.ib-tw3{animation:ibtw 2.6s ease-in-out infinite 1.6s;transform-box:fill-box;transform-origin:center}
.ib-needle{animation:ibneedle 4s ease-in-out infinite;transform-origin:0 0}
.ib-draw{stroke-dasharray:40;animation:ibdraw 3s ease-in-out infinite}
.ib-k1{animation:ibk 3.2s ease-in-out infinite}
.ib-k2{animation:ibk 3.2s ease-in-out infinite -1.1s}
.ib-k3{animation:ibk 3.2s ease-in-out infinite -2.2s}
.ib-rock{animation:ibrock 3s ease-in-out infinite;transform-origin:0 0}
.ib-blink{animation:ibblink 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ib-slash{stroke-dasharray:60;animation:ibdraw 4s ease-in-out infinite}
.ib-float{animation:ibfloat 3.4s ease-in-out infinite}
.ib-orbit{animation:iborbit 3s linear infinite}
.ib-bob{animation:ibfloat 2.8s ease-in-out infinite}
.ib-fly{animation:ibfly 3s ease-in-out infinite}
.ib-trail{animation:ibtw 1.5s ease-in-out infinite}
.ib-shackle{animation:ibshackle 3s ease-in-out infinite}
.ib-trace{stroke-dasharray:36;animation:ibdraw 2.6s linear infinite}
.ib-globe{animation:ibglobe 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ibspin{to{transform:rotate(360deg)}}
@keyframes ibpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes ibtw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes ibneedle{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(35deg)}}
@keyframes ibdraw{0%{stroke-dashoffset:40}35%,100%{stroke-dashoffset:0}}
@keyframes ibk{0%,100%{transform:translateX(-12px)}50%{transform:translateX(12px)}}
@keyframes ibrock{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes ibblink{0%,44%,52%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
@keyframes ibfloat{0%,100%{transform:translateY(2px)}50%{transform:translateY(-3px)}}
@keyframes iborbit{to{stroke-dashoffset:-132}}
@keyframes ibfly{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-4px)}}
@keyframes ibshackle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes ibglobe{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.25)}}

</style>
</defs>
<g clip-path="url(#c)">
<rect width="1280" height="132" fill="url(#bg)"/>
<g class="dots"><rect x="-26" y="-26" width="1332" height="184" fill="url(#dots)"/></g>
<g class="drift"><circle cx="1120" cy="20" r="230" fill="url(#gl2)"/></g>
<circle cx="76" cy="66" r="78" fill="url(#gl)"/>
<rect class="ring" x="34" y="24" width="84" height="84" rx="24" fill="none" stroke="#FFD27A" stroke-width="2"/>
<rect x="34" y="24" width="84" height="84" rx="24" fill="url(#tile)" stroke="#E8A33D" stroke-opacity=".7" stroke-width="1.5"/>
<g transform="translate(76 66) scale(1.25)"><path d="M-20 -12 H20" stroke="#F1ECFF" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/><circle class="ib-k1" cx="0" cy="-12" r="5" fill="url(#ig)" stroke="#F1ECFF" stroke-width="2"/><path d="M-20 0 H20" stroke="#F1ECFF" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/><circle class="ib-k2" cx="0" cy="0" r="5" fill="url(#ig)" stroke="#F1ECFF" stroke-width="2"/><path d="M-20 12 H20" stroke="#F1ECFF" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/><circle class="ib-k3" cx="0" cy="12" r="5" fill="url(#ig)" stroke="#F1ECFF" stroke-width="2"/></g>
<g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
<text class="in" x="150" y="48" font-size="15" font-weight="700" letter-spacing="3" fill="#FFD27A">07</text>
<text class="in2" x="148" y="86" font-size="36" font-weight="700" fill="url(#tt)" letter-spacing="-.5">Что MakeyStar меняет в системе</text>
<text class="in3" x="150" y="114" font-size="17" fill="#9B93B8">Только то, что нужно для работы, — и всё отменяется одной кнопкой</text>
</g>
<path d="M150 126 H1250" stroke="url(#ln)" stroke-width="1.5"/>
<path class="pk" d="M150 126 H1250" stroke="#FFD27A" stroke-width="3" stroke-linecap="round" fill="none"/>
</g>
<rect x=".5" y=".5" width="1279" height="131" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>
